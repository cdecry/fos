<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.55.2/phaser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/colyseus.js/dist/colyseus.js"></script>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <title>Fantage Remake - Login</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
            margin: 0;
            padding: 0;
            height: 100vh;
            background-image: url('assets/ui/login_background.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .logo {
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 5px 15px rgba(255, 255, 255, 0.7));
            z-index: 10;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .container {
            background: linear-gradient(to bottom, #ffffff, #e6f7ff);
            border: 5px solid #4db8ff;
            border-radius: 25px;
            padding: 30px;
            width: 350px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3), 0 0 20px rgba(107, 213, 255, 0.5);
            position: relative;
            overflow: hidden;
            z-index: 10;
        }

        .container::before {
            content: "";
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            background: url('assets/ui/sparkle.png') repeat;
            opacity: 0.1;
            animation: sparkle 5s linear infinite;
            z-index: -1;
        }

        @keyframes sparkle {
            0% { background-position: 0 0; }
            100% { background-position: 100px 100px; }
        }

        h1 {
            color: #ff6b9e;
            text-align: center;
            font-size: 32px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2), 0 0 10px rgba(255, 107, 158, 0.5);
        }

        input {
            padding: 12px 15px;
            width: 100%;
            border: 3px solid #b3e0ff;
            border-radius: 15px;
            font-size: 16px;
            margin-bottom: 15px;
            box-sizing: border-box;
            font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
            background-color: rgba(255, 255, 255, 0.8);
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #ff6b9e;
            outline: none;
            box-shadow: 0 0 15px rgba(77, 184, 255, 0.7);
        }

        button {
            background: linear-gradient(to bottom, #ffcc66, #ff9933);
            color: white;
            border: none;
            border-radius: 15px;
            padding: 12px 20px;
            font-size: 18px;
            cursor: pointer;
            width: 100%;
            font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }

        button:hover {
            background: linear-gradient(to bottom, #ff9933, #ff8000);
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: translateY(1px);
        }

        p {
            text-align: center;
            margin-top: 15px;
            color: #666;
            font-size: 16px;
        }

        a {
            color: #ff6b9e;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        a:hover {
            color: #ff3377;
            text-decoration: underline;
            text-shadow: 0 0 5px rgba(255, 107, 158, 0.5);
        }

        .bubbles {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
        }

        .bubble {
            position: absolute;
            bottom: -100px;
            width: 40px;
            height: 40px;
            background: radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.4) 70%, rgba(255, 255, 255, 0) 100%);
            border-radius: 50%;
            opacity: 0.5;
            animation: rise 15s infinite ease-in;
            pointer-events: none;
        }

        .bubble:nth-child(1) {
            width: 40px;
            height: 40px;
            left: 10%;
            animation-duration: 8s;
        }

        .bubble:nth-child(2) {
            width: 20px;
            height: 20px;
            left: 20%;
            animation-duration: 5s;
            animation-delay: 1s;
        }

        .bubble:nth-child(3) {
            width: 50px;
            height: 50px;
            left: 35%;
            animation-duration: 10s;
            animation-delay: 2s;
        }

        .bubble:nth-child(4) {
            width: 80px;
            height: 80px;
            left: 50%;
            animation-duration: 7s;
            animation-delay: 0s;
        }

        .bubble:nth-child(5) {
            width: 35px;
            height: 35px;
            left: 55%;
            animation-duration: 6s;
            animation-delay: 1s;
        }

        .bubble:nth-child(6) {
            width: 45px;
            height: 45px;
            left: 65%;
            animation-duration: 8s;
            animation-delay: 3s;
        }

        .bubble:nth-child(7) {
            width: 25px;
            height: 25px;
            left: 75%;
            animation-duration: 7s;
            animation-delay: 2s;
        }

        .bubble:nth-child(8) {
            width: 80px;
            height: 80px;
            left: 80%;
            animation-duration: 12s;
            animation-delay: 2s;
        }

        @keyframes rise {
            0% {
                bottom: -100px;
                transform: translateX(0) rotate(0deg);
                opacity: 0.3;
            }
            50% {
                transform: translateX(100px) rotate(180deg);
                opacity: 0.6;
            }
            100% {
                bottom: 1080px;
                transform: translateX(-200px) rotate(360deg);
                opacity: 0;
            }
        }
        
        .mascot {
            position: absolute;
            bottom: -30px;
            right: -20px;
            width: 120px;
            transform: rotate(15deg);
            animation: bounce 2s ease infinite alternate;
            z-index: 5;
        }

        @keyframes bounce {
            0% { transform: translateY(0) rotate(15deg); }
            100% { transform: translateY(-10px) rotate(15deg); }
        }
        
        .star {
            position: absolute;
            width: 20px;
            height: 20px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 51 48"><path fill="%23FFD700" d="M25,1 L31,17 L48,17 L35,29 L39,45 L25,36 L11,45 L15,29 L2,17 L19,17 Z"/></svg>');
            background-size: contain;
            z-index: 1;
            opacity: 0.8;
            animation: twinkle 5s infinite linear;
            pointer-events: none;
        }

        .star:nth-child(1) { top: 10%; left: 20%; animation-delay: 0s; }
        .star:nth-child(2) { top: 25%; left: 85%; animation-delay: 1s; }
        .star:nth-child(3) { top: 60%; left: 5%; animation-delay: 2s; }
        .star:nth-child(4) { top: 75%; left: 75%; animation-delay: 3s; }
        .star:nth-child(5) { top: 40%; left: 50%; animation-delay: 4s; }
        .star:nth-child(6) { top: 80%; left: 30%; animation-delay: 2.5s; }
        .star:nth-child(7) { top: 15%; left: 60%; animation-delay: 1.5s; }
        .star:nth-child(8) { top: 50%; left: 15%; animation-delay: 3.5s; }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        
        .flying-star {
            position: absolute;
            width: 60px;
            height: 60px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 51 48"><path fill="%23FFD700" d="M25,1 L31,17 L48,17 L35,29 L39,45 L25,36 L11,45 L15,29 L2,17 L19,17 Z"/></svg>');
            background-size: contain;
            animation: fly 10s linear infinite;
            opacity: 0.8;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes fly {
            0% { 
                transform: translateX(-100px) translateY(0) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { 
                transform: translateX(calc(100vw + 100px)) translateY(-200px) rotate(360deg);
                opacity: 0;
            }
        }

        .star-1 { top: 15%; animation-delay: 0s; }
        .star-2 { top: 35%; animation-delay: 3s; }
        .star-3 { top: 60%; animation-delay: 6s; }
        
        .glow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(255, 255, 255, 0.5) 0%, rgba(255, 255, 255, 0) 70%);
            pointer-events: none;
            z-index: 1;
            opacity: 0.5;
            animation: pulse 4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.7; }
        }
    </style>
</head>
<body>
    <div class="glow"></div>
    
    <div class="stars">
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
    </div>
    
    <div class="flying-star star-1"></div>
    <div class="flying-star star-2"></div>
    <div class="flying-star star-3"></div>
    
    <div class="bubbles">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <div class="logo">
        <img src="assets/ui/logo.png" alt="Fantage Logo" width="300">
    </div>

    <div class="container">
        <img src="assets/ui/cute_pet1.png" class="mascot" alt="Cute Mascot">
        <h1>Welcome Back!</h1>
        
        <input type="text" id="username" placeholder="Username or Email" autocomplete="off">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Play Now!</button>
        <p>Don't have an account? <a href="/signup.html">Sign Up</a></p>
    </div>

    <script>

        function createRandomStars() {
            const starsContainer = document.querySelector('.stars');
            for (let i = 0; i < 15; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.top = `${Math.random() * 100}%`;
                star.style.left = `${Math.random() * 100}%`;
                star.style.width = `${Math.random() * 20 + 10}px`;
                star.style.height = star.style.width;
                star.style.animationDelay = `${Math.random() * 5}s`;
                starsContainer.appendChild(star);
            }
        }
        
        
        function createMoreBubbles() {
            const bubblesContainer = document.querySelector('.bubbles');
            for (let i = 0; i < 15; i++) {
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                bubble.style.left = `${Math.random() * 100}%`;
                bubble.style.width = `${Math.random() * 50 + 10}px`;
                bubble.style.height = bubble.style.width;
                bubble.style.animationDuration = `${Math.random() * 10 + 5}s`;
                bubble.style.animationDelay = `${Math.random() * 10}s`;
                bubblesContainer.appendChild(bubble);
            }
        }
        
        window.addEventListener('load', () => {
            createRandomStars();
            createMoreBubbles();
        });
        
        
        async function login() {
            const identifier = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            if (!identifier || !password) {
                alert("Please enter your username/email and password!");
                return;
            }
            
            try {
                const button = document.querySelector('button');
                button.textContent = "Logging in...";
                button.disabled = true;
                
                const response = await fetch("https://fantage.onrender.com/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ identifier, password }),
                    credentials: "include"
                });

                const data = await response.json();
                if (data.success) {
                    console.log(`✅ Logged in as: ${data.username}`);
                    
                    button.textContent = "Success!";
                    
                    
                    document.body.style.transition = "all 0.5s ease";
                    document.body.style.filter = "brightness(200%)";
                    
                    setTimeout(() => {
                        // Redirect to game
                        window.location.href = "game.html";
                    }, 800);
                    
                } else {
                    console.error("❌ Invalid login", data.message);
                    alert(data.message);
                    button.textContent = "Play Now!";
                    button.disabled = false;
                }
            } catch (error) {
                console.error("❌ Login failed:", error);
                alert("Login failed. Please try again later.");
                document.querySelector('button').textContent = "Play Now!";
                document.querySelector('button').disabled = false;
            }
        }
        
        
        document.getElementById("password").addEventListener("keyup", function(event) {
            if (event.key === "Enter") {
                login();
            }
        });

        
        document.querySelectorAll('.bubble').forEach(bubble => {
            const delay = Math.random() * 10;
            const duration = 5 + Math.random() * 10;
            
            bubble.style.animationDelay = `${delay}s`;
            bubble.style.animationDuration = `${duration}s`;
        });
    </script>
</body>
</html>
